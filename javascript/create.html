<!DOCTYPE html>
<meta charset="utf-8">
<title>Create CII with InvoiceXML API</title>
<!--
  Get API key: https://www.invoicexml.com/account/authentication
  Docs:        https://www.invoicexml.com/docs/api/create/cii

  WARNING: do not ship API keys in production browser code. Anyone who
  views the page source can read and reuse your key. For production,
  proxy this request through your own backend so the key stays server-side.
-->

<h1>Create CII invoice</h1>
<button id="run">Generate invoice</button>
<p id="status"></p>

<script>
// Raw key only, without the "Bearer " prefix (it is added below).
const apiKey = 'YOUR_API_KEY';

// Totals and the VAT breakdown are calculated from the line items.
const payload = {
    invoice: {
        invoiceNumber: 'CII-2026-001',
        issueDate:     '2026-05-18',
        currency:      'EUR',
        seller: {
            name:              'Acme GmbH',
            vatIdentifier:     'DE123456789',
            legalRegistration: { identifier: 'HRB 12345' },
            postalAddress: {
                line1:    'Hauptstraße 12',
                city:     'Berlin',
                postCode: '10115',
                country:  'DE',
            },
        },
        buyer: {
            name: 'Globex SAS',
            postalAddress: {
                line1:    '15 rue de Rivoli',
                city:     'Paris',
                postCode: '75001',
                country:  'FR',
            },
        },
        paymentDetails: { paymentAccountIdentifier: 'DE89370400440532013000' },
        lines: [
            {
                quantity:       10,
                priceDetails:   { netPrice: 150.00 },
                vatInformation: { rate: 19.00 },
                item:           { name: 'Senior consulting' },
            },
        ],
    },
};

document.getElementById('run').addEventListener('click', async () => {
    const status = document.getElementById('status');
    status.textContent = 'Generating...';

    const response = await fetch('https://api.invoicexml.com/v1/create/cii', {
        method: 'POST',
        headers: {
            'Content-Type': 'application/json',
            Authorization: 'Bearer ' + apiKey,
        },
        body: JSON.stringify(payload),
    });

    if (!response.ok) {
        status.textContent = `InvoiceXML API error ${response.status}: ${await response.text()}`;
        return;
    }

    const xml = await response.text();
    const blob = new Blob([xml], { type: 'application/xml' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'invoice-cii.xml';
    a.click();
    status.textContent = `Downloaded invoice-cii.xml (${xml.length} chars)`;
});
</script>
